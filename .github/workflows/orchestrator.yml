name: Orchestrator CI

on:
  # main is tested by the Release workflow, which calls this one on every
  # push to main without a path filter (ARCHITECTURE.md, "Server
  # deployment", "Promotion"); pull requests keep the path filter.
  workflow_call:
  pull_request:
    paths: ["orchestrator/**", ".github/workflows/orchestrator.yml"]

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Format, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orchestrator
    env:
      # Nothing in CI opens a debugger or reads a core dump, and debug info is
      # most of the bulk of a dev-profile build: dropping it shrinks the
      # workspace build, the link step, the 34 test binaries and the
      # `rust-cache` entry that carries them all. `0` rather than
      # `line-tables-only` because failures are diagnosed on a developer
      # machine, which keeps full debug info, and a panic here still resolves
      # frames to function names — only the line numbers go. The `test`
      # profile inherits from `dev` and `cargo clippy` also builds under
      # `dev`, so this one variable covers fmt, clippy and the tests.
      # `rust-cache` hashes the `CARGO_*` environment into its key, so this
      # job's entry can never be restored into a build wanting another debug
      # level; the first run after this change rebuilds, later ones hit.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The debug test binaries plus the cached target directory and the
      # testcontainers Postgres image outran the runner disk (pulling
      # postgres:18 failed with "no space left on device"). Preinstalled
      # toolchains this job never uses are removed first.
      #
      # As the job's first foreground step this took 312 s with nothing else
      # happening. It is detached here and waited on below instead, so it runs
      # while the toolchain installs, the cache restores and fmt and clippy
      # run. `nohup` and `disown` are what survive this step's shell exiting;
      # a plain `... &` would be killed with it.
      - name: Start freeing runner disk space
        run: |
          df -h /
          cat > "$RUNNER_TEMP/free-disk.sh" <<'SCRIPT'
          set -x
          rc=0
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || rc=$?
          sudo docker image prune --all --force > /dev/null || rc=$?
          df -h /
          echo "$rc" > "$RUNNER_TEMP/free-disk.status"
          SCRIPT
          nohup bash "$RUNNER_TEMP/free-disk.sh" > "$RUNNER_TEMP/free-disk.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/free-disk.pid"
          disown
          echo "freeing disk in the background, pid $(cat "$RUNNER_TEMP/free-disk.pid")"

      # rustup reads orchestrator/rust-toolchain.toml here and installs the
      # pinned channel with its rustfmt and clippy components.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustc --version
          cargo fmt --version
          cargo clippy --version

      # The test runner (ADR 0037). A prebuilt binary, so this costs seconds
      # and never compiles nextest itself.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestrator
          # Save the entry even when a later step fails, so a `Cargo.lock`
          # change is not recompiled from scratch by every failing run until
          # one finally passes.
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (integration-tests)
        run: cargo clippy --all-targets --features integration-tests -- -D warnings

      # A process started in an earlier step is not a child of this step's
      # shell, so `wait` cannot see it and the pid is polled instead. This
      # sits before the build rather than between the build and the run so
      # that `docker image prune` never competes for disk with the test
      # binaries being linked, and it still guarantees the prune is finished
      # before testcontainers pulls postgres:18.
      - name: Wait for the runner disk to be freed
        run: |
          pid="$(cat "$RUNNER_TEMP/free-disk.pid")"
          while kill -0 "$pid" 2>/dev/null; do
            sleep 5
          done
          cat "$RUNNER_TEMP/free-disk.log"
          df -h /
          status="$(cat "$RUNNER_TEMP/free-disk.status" 2>/dev/null || echo missing)"
          echo "free-disk exit status: ${status}"
          if [ "${status}" != "0" ]; then
            echo "::error::freeing runner disk space failed"
            exit 1
          fi

      # Split from the run below so the step timings report compiling the
      # crate and its test binaries separately from executing the tests.
      - name: Build the test binaries
        run: cargo nextest run --features integration-tests --no-run

      # Integration tests bring up Postgres through testcontainers on the
      # Docker daemon that ubuntu-latest provides: one container for the whole
      # run, shared by every test process (`tests/common/db.rs`). DOCKER_HOST
      # is deliberately unset, and `tests/engine.rs` and
      # `tests/session_e2e.rs` are not part of a nextest run anyway — the
      # Engine workflow is where they run (ADR 0037).
      - name: Tests
        run: cargo nextest run --profile ci --features integration-tests

      # nextest runs no doctests, so the one `no_run` example in `src/git/`
      # would otherwise stop being compiled.
      - name: Doctests
        run: cargo test --features integration-tests --doc

  # The job above runs on the runner's git, which is far newer than the one the
  # orchestrator image ships, so an argv only newer git accepts passed every
  # check and still failed every session launch on the packaged image
  # (n3kps). This job runs the git tests on two older gits instead:
  #
  #   * `rust:1.98.1-trixie`, the Dockerfile's builder base — the same Debian
  #     release as its `debian:trixie-slim` runtime stage, so this is the git
  #     the packaged image ships (2.47.x). Move this tag with the Dockerfile.
  #   * `rust:1.98.1-bookworm`, which carries git 2.39.5 — the documented
  #     minimum supported git for a host run (`README.md`, "Development";
  #     `ARCHITECTURE.md`, "Git model", Supported git). Without this leg that
  #     floor would be a claim nothing checks, which is exactly how the
  #     `checkout --end-of-options` breakage survived CI.
  #
  # Only the test binaries that need neither Postgres nor a container engine
  # are selected, which is every git test that is not a `TestApp` test (each
  # one says so in its own module docs); the git unit tests beside the modules
  # come along through `--lib git::`. So this job needs no service container
  # and no Docker socket.
  git-versions:
    name: Git tests on ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rust:1.98.1-trixie
            label: the image's git (trixie)
            cache-key: git-trixie
          - image: rust:1.98.1-bookworm
            label: the minimum supported git (bookworm, 2.39)
            cache-key: git-bookworm
    container: ${{ matrix.image }}
    defaults:
      run:
        working-directory: orchestrator
    env:
      # `orchestrator/rust-toolchain.toml` asks for the `stable` channel, which
      # is not an installed toolchain name in the `rust` image and would make
      # rustup download a second toolchain here. The Dockerfile avoids this by
      # not copying the file; inside a checkout it has to be overridden.
      RUSTUP_TOOLCHAIN: "1.98.1"
      # As in the job above: nothing here reads a core dump.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Report the git the tests will run
        run: |
          git --version
          rustc --version

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestrator
          # Its own entry per container: each one's glibc and rustc
          # fingerprints differ from the runner's and from each other's, so
          # none may restore another job's target directory.
          key: ${{ matrix.cache-key }}
          cache-on-failure: true

      # `--no-fail-fast` so one bad argv does not hide the others: the point of
      # this job is to report every call site the older git rejects in one run.
      - name: Git unit tests
        run: |
          cargo test --features integration-tests --lib --no-fail-fast 'git::'

      - name: Git integration tests
        run: |
          cargo test --features integration-tests --no-fail-fast \
            --test git_session --test git_merge --test git_rebase \
            --test git_diff --test git_mirror --test git_push --test git_fetch

  # `.sqlx/` is what lets the jobs above build with SQLX_OFFLINE=true. This job
  # regenerates nothing: it rebuilds the query set against a real Postgres and
  # fails when the committed cache no longer matches the queries in the crate.
  sqlx-offline-data:
    name: sqlx offline data is current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orchestrator
    env:
      # The check talks to the service container, so the offline cache must not
      # short-circuit it.
      SQLX_OFFLINE: "false"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_VERSION: 0.9.0
      # `cargo sqlx prepare --check` compiles the crate and its test targets
      # too, so it gains the same way the job above does; see the comment
      # there for why `0` and not `line-tables-only`. `rust-cache` keys on the
      # job as well as on this environment, so the two jobs keep separate
      # entries and neither can restore the other's debug level.
      CARGO_PROFILE_DEV_DEBUG: "0"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          rustup show
          rustc --version

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestrator
          # As in the job above: a failed check should not throw away the
          # compile it just paid for.
          cache-on-failure: true

      # The CLI version has to match the `sqlx` crate in orchestrator/Cargo.lock.
      - name: Cache the sqlx CLI
        id: cache-sqlx-cli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-sqlx
            ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ runner.os }}-${{ env.SQLX_VERSION }}

      - name: Install the sqlx CLI
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version ${{ env.SQLX_VERSION }} --no-default-features --features postgres,rustls --locked

      - name: Migrate
        run: cargo sqlx migrate run

      - name: Check that .sqlx matches the queries in the crate
        run: cargo sqlx prepare --check -- --all-targets --features integration-tests
