# Rootless Podman override (README.md, "Podman setup"; ADR 0035).
#
# `keep-id` maps the host service user onto the same uid inside the container,
# so files under /data keep the service user's ownership and the mounted socket
# stays usable. Podman then sets the container user from the host uid, so no
# `user:` is given here; the image works under any uid.
#
#   -f compose.yml -f compose.podman.yml
#
# (or COMPOSE_FILE=compose.yml:compose.podman.yml, which podman-compose 1.6.0
# reads only from the process environment, not from `.env`)
#
# This one line is the whole Podman side of the difference; the Docker side is
# two (`user:` and `group_add:`, see compose.docker.yml).
services:
  orchestrator:
    userns_mode: keep-id
