# Mars frontend image: replaces /etc/nginx/nginx.conf from the official nginx image.
# Only http-level settings live here; the server block is nginx/default.conf.template,
# which the image's entrypoint renders into /etc/nginx/conf.d/ with envsubst.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The image default, used for every location that does not opt into `noquery`.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # WebSocket and SSE endpoints carry the access token as `?token=` (SPEC.md,
    # "Authentication"), so the locations that serve them must log a format that
    # cannot contain a query string: no $request, $args, $request_uri or
    # $query_string. $uri is the normalised, query-free path.
    log_format  noquery  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';

    access_log  /var/log/nginx/access.log  main;

    server_tokens  off;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # A plain GET on /ws/ (a scanner, say) must reach the orchestrator and get its
    # normal 4xx instead of a broken upgrade, so the Connection header follows
    # whether the client actually asked to upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      application/manifest+json
                      application/xml
                      image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
