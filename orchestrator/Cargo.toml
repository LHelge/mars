[package]
name = "mars-orchestrator"
version = "0.1.0"
edition = "2024"

[lib]
name = "mars_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "mars-orchestrator"
path = "src/main.rs"

[features]
integration-tests = []

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bollard = "0.20"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
jsonwebtoken = "11.1.0"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"

[dev-dependencies]
axum-test = "21.1.0"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
