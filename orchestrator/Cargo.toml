[package]
name = "mars-orchestrator"
version = "0.1.0"
edition = "2024"

[lib]
name = "mars_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "mars-orchestrator"
path = "src/main.rs"

[features]
# `dep:tempfile` because `git::testutil` builds real repositories from library
# code under this feature (`CLAUDE.md`, "Testing expectations": git is never
# mocked), not only from the test harness.
integration-tests = ["dep:tempfile"]

# Dependencies are compiled with light optimisation even in a debug build; the
# crate itself is not, so an edit still recompiles at debug speed and a
# backtrace still points at our own lines. The test suite spends most of its
# CPU inside sqlx, serde and tokio rather than inside this crate, and an
# unoptimised build of those is several times slower than a lightly optimised
# one (ADR 0037, `CLAUDE.md`, "Code quality"). Dependencies are built once per
# build directory, so this is paid once and only there.
[profile.dev.package."*"]
opt-level = 1

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bollard = "0.20"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
croner = { version = "4.0.0", features = ["chrono"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
# Optional, and also a dev-dependency below: `git::testutil` needs it from
# library code when `integration-tests` is on, and the tests need it always.
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"

[dev-dependencies]
axum-test = { version = "21.1.0", features = ["ws"] }
# Only for `atexit`, which is how `tests/common/db.rs` removes the test
# Postgres container: the test harness exits with `std::process::exit`, so no
# destructor runs.
libc = "0.2.189"
rmcp = { version = "3.4.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.53.1", features = ["test-util"] }
